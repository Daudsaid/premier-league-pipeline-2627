name: Run PL Pipeline

on:
  schedule:
    - cron: "0 8 * * 1,4"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project
        run: uv pip install --system ".[dev]"

      - name: Debug source connectivity
        run: curl -v https://football-data.co.uk/mmz4281/2627/E0.csv -o /dev/null
        continue-on-error: true

      - name: Run pipeline
        run: plp2627 run --season 2627
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
